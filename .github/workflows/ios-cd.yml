name: iOS CD

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Validate tag format
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "::error::지원하지 않는 태그 형식입니다: $TAG (허용: vX.Y.Z 또는 vX.Y.Z-beta.N)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Restore Secrets
        env:
          SECRETS_ARCHIVE_BASE64: ${{ secrets.SECRETS_ARCHIVE_BASE64 }}
        run: |
          if [ -z "${SECRETS_ARCHIVE_BASE64}" ]; then
            echo "::error::SECRETS_ARCHIVE_BASE64가 등록되어 있지 않습니다."
            exit 1
          fi
          printf '%s' "${SECRETS_ARCHIVE_BASE64}" | base64 -D > Secrets.tar.gz
          rm -rf Secrets
          tar -xzf Secrets.tar.gz
          rm Secrets.tar.gz

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2

      - name: Cache Tuist and SPM
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            Tuist/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-tuist-spm-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tuist-spm-

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate Xcode workspace
        run: tuist generate
        
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_26.2.0.app

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      # 프로비저닝 프로파일 이름 추출 (Fastlane export_options에서 사용)
      - name: Extract provisioning profile name
        id: profile
        run: |
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" /dev/stdin <<< \
            "$(security cms -D -i Secrets/Xcode/Peaktime.mobileprovision)")
          echo "name=${PROFILE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Deploy beta (TestFlight)
        if: contains(github.ref_name, '-beta')
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
          PROVISIONING_PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: bundle exec fastlane beta

      - name: Deploy release (App Store)
        if: ${{ !contains(github.ref_name, '-beta') }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          TAG_NAME: ${{ github.ref_name }}
          PROVISIONING_PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: bundle exec fastlane release
