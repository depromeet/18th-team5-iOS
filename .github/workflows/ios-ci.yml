name: iOS CI

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Merge develop into PR branch
        run: |
          git fetch origin develop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-ff origin/develop; then
            echo "::error::develop 브랜치와 충돌이 발생했습니다. CI 빌드 전에 PR 브랜치에서 develop을 merge하고 conflict를 먼저 해결해주세요."
            git merge --abort || true
            exit 1
          fi

      - name: Check required test files
        run: Tools/ci/check-required-tests.sh origin/develop

      - name: Select iOS simulator
        id: simulator
        run: |
          set -euo pipefail

          xcodebuild -version
          xcrun simctl list devices available

          destination="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import re
          import sys

          devices_by_runtime = json.load(sys.stdin).get("devices", {})
          candidates = []

          for runtime, devices in devices_by_runtime.items():
              match = re.search(r"iOS-(\\d+)-(\\d+)", runtime)
              if not match:
                  continue

              runtime_version = tuple(map(int, match.groups()))
              for index, device in enumerate(devices):
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      candidates.append((runtime_version, -index, device["name"]))

          if not candidates:
              sys.exit("No available iPhone simulator found")

          candidates.sort(reverse=True)
          _, _, device_name = candidates[0]
          print(f"platform=iOS Simulator,name={device_name},OS=latest")
          ')"

          echo "destination=${destination}" >> "$GITHUB_OUTPUT"
          echo "Selected simulator destination: ${destination}"

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Restore Firebase Dev config
        env:
          GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64 }}
        run: |
          if [ -z "${GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64}" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64 GitHub Actions Secret이 등록되어 있지 않습니다."
            exit 1
          fi

          mkdir -p Secrets/GoogleService-Info/Dev
          printf '%s' "${GOOGLE_SERVICE_INFO_DEV_PLIST_BASE64}" | base64 -D > Secrets/GoogleService-Info/Dev/GoogleService-Info.plist

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate Xcode workspace
        run: tuist generate

      - name: Build Peaktime DEV
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Peaktime.xcworkspace \
            -scheme "Peaktime DEV" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}"

      - name: Test Core
        id: test-core
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -workspace Peaktime.xcworkspace \
            -scheme "CoreTests" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults/CoreTests.xcresult

      - name: Test Data
        id: test-data
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -workspace Peaktime.xcworkspace \
            -scheme "DataTests" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults/DataTests.xcresult

      - name: Test Domain
        id: test-domain
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -workspace Peaktime.xcworkspace \
            -scheme "DomainTests" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults/DomainTests.xcresult

      - name: Test Presentation
        id: test-presentation
        continue-on-error: true
        run: |
          set -o pipefail
          mkdir -p TestResults
          xcodebuild test \
            -workspace Peaktime.xcworkspace \
            -scheme "PresentationTests" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}" \
            -resultBundlePath TestResults/PresentationTests.xcresult

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.xcresult
          if-no-files-found: ignore

      - name: Fail on test failure
        if: >-
          steps.test-core.outcome == 'failure' ||
          steps.test-data.outcome == 'failure' ||
          steps.test-domain.outcome == 'failure' ||
          steps.test-presentation.outcome == 'failure'
        run: exit 1
