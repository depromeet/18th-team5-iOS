name: iOS CI

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Merge develop into PR branch
        run: |
          git fetch origin develop
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! git merge --no-edit --no-ff origin/develop; then
            echo "::error::develop 브랜치와 충돌이 발생했습니다. CI 빌드 전에 PR 브랜치에서 develop을 merge하고 conflict를 먼저 해결해주세요."
            git merge --abort || true
            exit 1
          fi

      - name: Check required test files
        run: Tools/ci/check-required-tests.sh origin/develop

      - name: Select iOS simulator
        id: simulator
        run: Tools/ci/select-ios-simulator.sh

      - name: Install mise
        uses: jdx/mise-action@v2

      - name: Cache Tuist and SPM dependencies
        uses: actions/cache@v4
        with:
          path: |
            Tuist/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ${{ runner.os }}-tuist-spm-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}
          restore-keys: |
            ${{ runner.os }}-tuist-spm-

      - name: Restore Secrets
        env:
          SECRETS_ARCHIVE_BASE64: ${{ secrets.SECRETS_ARCHIVE_BASE64 }}
        run: |
          if [ -z "${SECRETS_ARCHIVE_BASE64}" ]; then
            echo "::error::SECRETS_ARCHIVE_BASE64 GitHub Actions Secret이 등록되어 있지 않습니다."
            exit 1
          fi

          printf '%s' "${SECRETS_ARCHIVE_BASE64}" | base64 -D > Secrets.tar.gz
          rm -rf Secrets
          tar -xzf Secrets.tar.gz
          rm Secrets.tar.gz

          if [ ! -d "Secrets" ]; then
            echo "::error::SECRETS_ARCHIVE_BASE64 archive에 Secrets/ 폴더가 없습니다."
            exit 1
          fi

      - name: Install Tuist dependencies
        run: tuist install

      - name: Generate Xcode workspace
        run: tuist generate

      - name: Build Peaktime DEV
        run: |
          set -o pipefail
          xcodebuild build \
            -workspace Peaktime.xcworkspace \
            -scheme "Peaktime DEV" \
            -configuration DebugDev \
            -destination "${{ steps.simulator.outputs.destination }}"

      - name: Test all schemes
        id: test-all
        continue-on-error: true
        run: Tools/ci/run-xcode-tests.sh "${{ steps.simulator.outputs.destination }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.xcresult
          if-no-files-found: ignore

      - name: Fail on test failure
        if: steps.test-all.outcome == 'failure'
        run: exit 1
